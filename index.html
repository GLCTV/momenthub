<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one phone-width column, sticky header, four bottom tabs, bottom sheets for detail. Same shell as GymHub. */
:root{
  --bg:#F5F3F7;--card:#FFFFFF;--well:#F6EAF0;--ink:#1D1828;--mute:#716A80;--line:#E5E0EA;
  --acc:#B8235A;--accI:#FFFFFF;--gold:#9A6A00;--rec:#D93A40;
  --ui:Manrope,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --tc:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13101A;--card:#1E1A27;--well:#2B2030;--ink:#F1EEF6;--mute:#9B94AA;--line:#2D2838;--acc:#FF7FAE;--accI:#2B0716;--gold:#F2B33D;--rec:#FF6369;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13101A;--card:#1E1A27;--well:#2B2030;--ink:#F1EEF6;--mute:#9B94AA;--line:#2D2838;--acc:#FF7FAE;--accI:#2B0716;--gold:#F2B33D;--rec:#FF6369;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--ui);padding-bottom:104px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s,opacity .15s,background .25s,color .25s}
button:active{transform:scale(.96);opacity:.85}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:17px;margin:20px 0 8px;font-weight:800;text-wrap:balance}
p{margin:0}
small{color:var(--mute)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 8px;max-width:560px;margin:auto;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
header small{display:block;font-size:13px}
header small:empty{display:none}
.lg{border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;background:var(--card)}
main{padding:8px 20px 12px;max-width:560px;margin:auto}
#v>h2:first-child{font-size:32px;letter-spacing:-.02em;margin-bottom:4px}
.go{animation:pg .4s cubic-bezier(.32,.72,0,1)}
@keyframes pg{from{opacity:0;transform:translateY(8px) scale(.99)}}
#ft{max-width:560px;margin:8px auto 0;padding:0 20px 8px;text-align:center;color:var(--mute);font-size:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:11px;padding:2px;gap:2px;margin:10px 0 14px}
.seg button{flex:1;min-width:0;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

.callout{background:color-mix(in srgb,var(--acc) 11%,var(--card));border-radius:16px;padding:14px 16px;margin:6px 0 14px}
.callout p{margin-top:6px}
.kick{display:flex;align-items:center;gap:8px;font:500 12px/1.2 var(--tc);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rec);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.nt{display:block;font-size:19px;font-weight:800;line-height:1.25;margin-top:8px;text-wrap:balance}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--accI);font-weight:700;margin-top:16px}
.btn.s{width:auto;margin:0;padding:10px 14px}
.btn.gh{background:var(--card);color:var(--ink)}
.btn.dn{background:color-mix(in srgb,var(--ink) 10%,var(--card));color:var(--ink)}
.ghost{color:var(--acc);font-weight:700;padding:8px 0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat b span{font-size:14px;color:var(--mute);font-weight:700}
.stat small{font-size:12px}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}

.group{background:var(--card);border-radius:16px;overflow:hidden;margin:8px 0 12px}
.mrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.group>:last-child{border-bottom:0}
.ck{flex:none;width:54px;display:grid;place-items:center}
.ck i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck svg{width:14px;height:14px;fill:none;stroke:var(--accI);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mrow.done .ck i{background:var(--acc);border-color:var(--acc)}
.mrow.done .ck svg{opacity:1}
.mb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;padding:12px 14px 12px 0}
.mth{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--well);margin-right:4px}
.mb>span{flex:1;min-width:0}
.mb b{display:block;font-weight:700;line-height:1.3}
.mb small{display:block;font-size:13px;margin-top:2px}
.mrow.done .mb b{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.must{color:var(--gold);font-weight:700}
.chev{flex:none;margin-left:8px;font-style:normal;font-size:22px;line-height:1;color:var(--mute)}

.row{display:flex;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 10px;margin-bottom:8px;border-radius:14px;background:var(--card)}
.row>span:not(.th){flex:1;min-width:0}
.row b{display:block;font-weight:700}
.row small{display:block;font-size:13px;line-height:1.35;margin-top:2px}
.th{flex:none;width:76px;height:61px;border-radius:12px;background:var(--well);display:grid;place-items:center;margin-right:12px;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.th.big{width:100%;height:auto;aspect-ratio:100/80;margin:4px 0 0;border-radius:18px}

.dg{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.6}
.st-k{stroke:var(--ink)}.st-a{stroke:var(--acc)}.st-m{stroke:var(--mute)}.st-c{stroke:var(--card)}
.fl-k{fill:var(--ink)}.fl-a{fill:var(--acc)}.fl-m{fill:var(--mute)}.fl-c{fill:var(--card)}.fl-r{fill:var(--rec)}
.fov{fill:var(--acc);opacity:.18}
.tx{fill:var(--ink);font:500 7.5px var(--tc)}

#sheet{position:fixed;inset:0;z-index:5;background:rgba(10,8,16,.5);display:flex;align-items:flex-end;animation:fd .25s;transition:background .24s}
#sheet.fo{background:rgba(10,8,16,0)}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes dn{to{transform:translateY(100%)}}
.panel{background:var(--bg);width:100%;max-width:560px;margin:auto auto 0;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.panel.in{animation:up .4s cubic-bezier(.32,.72,0,1)}
.panel.out{animation:dn .24s ease-in forwards}
.panel::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin:-6px auto 10px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ph h2{margin:4px 0 0;font-size:24px;line-height:1.2}
.x{flex:none;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--mute);background:var(--card)}
.sec{margin-top:16px}
.sec h3{margin:0 0 4px;font:500 12px/1.2 var(--tc);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sec p{max-width:60ch}
.say{font-size:18px;font-weight:700;line-height:1.35}

.lks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 2px}
.lk{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.lk::after{content:"↗";color:var(--acc);font-weight:800}
.lk:active{opacity:.7}
.lkl{color:var(--mute);font-size:14px;font-weight:600}
a.row{text-decoration:none;color:inherit}
.row,.srow,.mb,.lk{transition:background .25s}
.row:active,.srow:active,.mb:active,.lk:active{background:color-mix(in srgb,var(--ink) 8%,var(--card))}
header{transition:box-shadow .25s}header.sc{box-shadow:0 1px 0 var(--line)}
.car{position:relative;margin:4px 0 0}
.cnav{position:absolute;top:calc(50% - 32px);width:40px;height:40px;border-radius:50%;background:rgba(10,8,16,.55);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.cnav.pv{left:8px}.cnav.nx{right:8px}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px}
.slides::-webkit-scrollbar{display:none}
.sl{position:relative;flex:none;width:100%;margin:0;scroll-snap-align:center}
.sl .th.big{margin:0}
.panel>.sl{margin-top:10px}
.sl img{display:block;width:100%;aspect-ratio:100/80;object-fit:cover;border-radius:18px;background:var(--well)}
.sl figcaption{position:absolute;left:10px;right:10px;bottom:10px;display:flex}
.pw{position:relative}
.hb{flex:none;display:grid;gap:6px 8px;justify-items:end}.lg{white-space:nowrap;display:inline-flex;align-items:center}header>div:first-child{min-width:0}
.lg.sm{padding:3px 10px;font-size:12px;font-weight:600;color:var(--acc)}#inst[hidden]{display:none}
.slides{align-items:flex-start}
.sl .cap{padding:10px 4px 0}
.sl .cap b{display:block;font-size:16px;line-height:1.3}
.sl .cap p{color:var(--mute);margin-top:3px;line-height:1.45}
.car.g .cnav{top:0;margin-top:calc(40% - 20px)}
.cnt{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:999px;background:rgba(10,8,16,.62);color:#fff;font:500 12px/1.4 var(--tc);font-variant-numeric:tabular-nums;pointer-events:none}
.sl figcaption a{max-width:100%;padding:4px 8px;border-radius:8px;background:rgba(10,8,16,.62);color:#fff;font:500 11px/1.3 var(--tc);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl img{height:auto}
.cdots{display:flex;justify-content:center;gap:2px;margin-top:4px}
.cdots button{width:22px;height:22px;display:grid;place-items:center;padding:0}
.cdots button::before{content:"";width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);transition:background .25s,transform .25s}
.cdots button.on::before{background:var(--acc);transform:scale(1.25)}
.chev.out{font-size:17px;color:var(--acc);font-weight:800}
.srow .lks{margin:0;justify-content:flex-end}
.srow .lk{background:var(--well);padding:8px 12px}
.srow>b{flex:1;min-width:0}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:8px}
.card b{display:block}
.card p{color:var(--mute);margin-top:4px}
.sgr{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.sgr>span:last-child{flex:1;min-width:0}
.sgr b{display:block}
.sgr small{display:block;font-size:13px;line-height:1.35;margin-top:2px}
.tc{flex:none;width:96px;font:500 13px/1.5 var(--tc);font-variant-numeric:tabular-nums}
.tc em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:14px;margin:8px 0}
/* tiles: illustration-first grid */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;width:100%;text-align:left;padding:8px 8px 12px;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(20,10,30,.04),0 6px 18px -10px rgba(20,10,30,.18)}
.tile:active{transform:scale(.97)}
.tile .th{width:100%;height:auto;aspect-ratio:100/80;margin:0 0 10px;border-radius:14px}
.tile b{display:block;font-size:15px;font-weight:700;line-height:1.25;padding:0 4px;text-wrap:balance}
.tiles.sm .tile b{font-size:14px}
/* video cards (Montaj) */
.vids{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:2px 20px 6px;scroll-padding:0 20px}
.vids::-webkit-scrollbar{display:none}
.vc{flex:none;width:82%;scroll-snap-align:start}
.vf{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;padding:0}
.vf img{display:block;width:100%;height:100%;object-fit:cover;opacity:.92;transition:opacity .2s}
.vf:active img{opacity:.75}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vf .pl{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.vf .pl svg{width:22px;height:22px;margin-left:3px;fill:var(--acc)}
.vc b{display:block;font-size:14px;font-weight:600;line-height:1.3;margin:8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc small{display:block;font-size:12px;margin:2px 4px 0;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.tg{flex:none;width:51px;height:31px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(20px)}
.etq{margin:0;padding:0;list-style:none}
.etq li{padding:8px 0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.etq li:first-child{border-top:0;padding-top:0}
.etq li:last-child{padding-bottom:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;line-height:1.1;padding:8px 1px 7px;color:var(--mute)}
.tab span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(9.5px,2.75vw,11.5px);letter-spacing:-.015em}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
.ind{position:absolute;left:8px;top:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:calc((100% - 16px)/6);border-radius:14px;background:color-mix(in srgb,var(--acc) 14%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s cubic-bezier(.32,.72,0,1);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
/* ---------- Poze (iPhone-style gallery) ---------- */
.phd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pt{font-size:32px!important;letter-spacing:-.02em;margin:0 0 4px!important}
.pz{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin-bottom:6px}
.pz svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:6px -20px 0;touch-action:pan-y}
.pgrid.c5{grid-template-columns:repeat(5,1fr);gap:1px}
.pcell{position:relative;display:block;aspect-ratio:1;padding:0;overflow:hidden;background:var(--well);border-radius:0}
.pcell:active{transform:none;opacity:.7}
.pcell img{display:block;width:100%;height:100%;object-fit:cover}
.pcell .pfv{position:absolute;left:5px;bottom:4px;width:15px;height:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pcell .pfv svg{width:100%;height:100%;fill:#fff}
.pback{display:inline-flex;align-items:center;gap:2px;color:var(--acc);font-weight:700;font-size:17px;padding:4px 0 8px}
.pback b{font-size:28px;line-height:.8;font-weight:500;margin-top:-3px}
.palb{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:4px}
.pa{display:block;text-align:left;padding:0;min-width:0}
.pa:active{transform:scale(.97)}
.pac{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--well);margin-bottom:7px}
.pac img{width:100%;height:100%;object-fit:cover;display:block}
.pac svg{width:44px;height:44px;fill:var(--acc)}
.pa b{display:block;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa small{display:block;font-size:14px;font-variant-numeric:tabular-nums}

.pvw{position:fixed;inset:0;z-index:30;background:#000;color:#fff;animation:pvin .28s ease-out;touch-action:none;overflow:hidden;overscroll-behavior:none}
.pvw.out{animation:pvout .22s ease-in forwards}
@keyframes pvin{from{opacity:0}}
@keyframes pvout{to{opacity:0}}
.ptr{position:absolute;inset:0;display:flex;gap:16px;touch-action:none}
.psl{flex:none;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;touch-action:none}
.psl img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:none}
.pvw.zm .pnav{opacity:.0;pointer-events:none}
.pbar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;transition:opacity .25s,transform .25s;z-index:2}
.pbar.tp{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(0,0,0,.65),transparent)}
.pbar.bt{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.65));justify-content:space-between}
.pvw.hid .pbar{opacity:0;pointer-events:none}
.pvw.hid .pbar.tp{transform:translateY(-8px)}.pvw.hid .pbar.bt{transform:translateY(8px)}
.pbar .pti{flex:1;min-width:0;text-align:center}
.pbar .pti b{display:block;font-size:16px;font-weight:700}
.pbar .pti small{display:block;color:rgba(255,255,255,.7);font:500 12px/1.4 var(--tc);font-variant-numeric:tabular-nums}
.pib{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pib.on svg{fill:#FF4F6D;stroke:#FF4F6D}
.pib.sp{visibility:hidden}
.pchip{padding:10px 14px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pnav.pv{left:12px}.pnav.nx{right:12px}

.igw{display:flex;justify-content:center;min-height:420px}
.clcar{margin-top:6px}

const GAL={"m_w11":[{"src":"poses/gw01.jpg","by":"Jarad Lee","id":"qD9m3Q3p9E0","n":["De mână, la un pas distanță","Hand in hand, one step apart"],"d":["Stau față în față, la un pas unul de altul, și se țin de o singură mână. Spune-le să se uite unul la altul, nu la cameră.","They face each other a step apart, holding just one hand. Tell them to look at each other, not at the camera."]},{"src":"poses/gw02.jpg","by":"Audrey Hoover","id":"PpuQX3drBe4","n":["Mâinile, de aproape","The hands, up close"],"d":["El îi cuprinde mâna cu a lui, la nivelul taliei. Încadrează doar mâinile, verigheta și puțin din rochie.","He wraps her hand in his at waist height. Frame only the hands, the ring and a bit of the dress."]},{"src":"poses/gw03.jpg","by":"Ben Atkins","id":"JYR7DNdUqo4","n":["Mers la braț","Walking arm in arm"],"d":["Merg încet spre tine, lipiți umăr la umăr. Ea ține buchetul în față, el are o mână în buzunar și se uită la ea.","They walk slowly toward you, shoulder to shoulder. She holds the bouquet in front, he keeps a hand in his pocket and looks at her."]},{"src":"poses/gw04.jpg","by":"Fotógrafo Samuel Cruz","id":"-f_V-YwyrYI","n":["Mers de mână, pe mal","Hand in hand by the water"],"d":["Merg de mână, cu brațele întinse, și întorc capul unul spre altul. Lasă mult cer în cadru.","They walk hand in hand with arms extended and turn their heads toward each other. Leave plenty of sky in the frame."]},{"src":"poses/gw05.jpg","by":"Jonathan Borba","id":"_1yicIIMHf8","n":["Îmbrățișare din spate","The hug from behind"],"d":["El stă în spatele ei și o cuprinde cu brațele. Ea își pune mâinile peste ale lui, pe talie, și întoarce capul spre el.","He stands behind her and wraps his arms around her. She rests her hands over his at her waist and turns her head toward him."]},{"src":"poses/gw06.jpg","by":"Fotógrafo Samuel Cruz","id":"J8JkRWruCEw","n":["Mâna pe obrazul lui","Her hand on his cheek"],"d":["El o ține de talie, ea îi pune palma pe obraz. Așază-i cu soarele în spate, ca lumina să le contureze părul.","He holds her waist, she lays her palm on his cheek. Place them with the sun behind, so the light outlines their hair."]},{"src":"poses/gw07.jpg","by":"Marius Muresan","id":"dhW0gTVexdw","n":["Aproape de sărut","Almost a kiss"],"d":["Nas lângă nas, cu o clipă înainte de sărut. Mâna ei stă pe pieptul lui. Fotografiază din profil.","Nose to nose, a moment before the kiss. Her hand rests on his chest. Shoot them in profile."]},{"src":"poses/gw08.jpg","by":"mari lezhava","id":"egz7W1zHYbU","n":["Sărut pe frunte","The forehead kiss"],"d":["El o sărută pe frunte, ea închide ochii. O mână a ei stă pe pieptul lui, cealaltă pe ceafa lui.","He kisses her forehead, she closes her eyes. One of her hands rests on his chest, the other on the back of his neck."]},{"src":"poses/gw09.jpg","by":"Gemali Martinez","id":"Q4__uC0B3-E","n":["Sub voal, în vânt","Under the flying veil"],"d":["Cineva ridică voalul și îi dă drumul deasupra lor. El o sărută pe frunte, ea ține buchetul jos, în față.","Someone lifts the veil and lets it drop over them. He kisses her forehead, she holds the bouquet low in front."]},{"src":"poses/gw10.jpg","by":"Soulseeker - Creative Photography","id":"MhNvUsW0plE","n":["Sub voal, de aproape","Under the veil, up close"],"d":["Trag voalul peste amândoi și se apropie zâmbind. Fotografiază de foarte aproape, prin voal.","They pull the veil over both of them and lean in, smiling. Shoot from very close, through the veil."]},{"src":"poses/gw11.jpg","by":"Gemali Martinez","id":"-AntkUZ3_xk","n":["Voalul în vânt","The veil in the wind"],"d":["Așază-i cu vântul din lateral și lasă voalul să zboare. El o ține de talie și o sărută, ea lasă buchetul în jos.","Place them side-on to the wind and let the veil fly. He holds her waist and kisses her, she lets the bouquet hang down."]},{"src":"poses/gw12.jpg","by":"Antonella Quispe Tumay","id":"aL9OWhvBQ94","n":["Pirueta","The twirl"],"d":["El îi ridică mâna deasupra capului și o învârte încet. Rochia se rotește, așa că fă mai multe cadre la rând.","He lifts her hand above her head and turns her slowly. The dress spins, so take several frames in a row."]},{"src":"poses/gw13.jpg","by":"Jose Nicdao","id":"2eZ0Ztl7Xd0","n":["Lăsată pe spate","The dip"],"d":["El o sprijină cu o mână la spate și cu cealaltă de talie, apoi o apleacă ușor. Ea își ține brațul pe după gâtul lui.","He supports her with one hand on her back and one at her waist, then leans her back gently. She keeps an arm around his neck."]},{"src":"poses/gw14.jpg","by":"Brooke Balentine","id":"0oAcNVd0MXw","n":["Luată în brațe","Carried in his arms"],"d":["El o ridică, cu un braț sub genunchi și unul la spate. Ea își pune brațele pe după gâtul lui.","He lifts her with one arm under her knees and one behind her back. She puts her arms around his neck."]},{"src":"poses/gw15.jpg","by":"Jens Lindner","id":"_a6FrbUXFfc","n":["Așezați, relaxați","Sitting down, relaxed"],"d":["Stau pe o bancă sau pe trepte, aproape unul de altul. Ea ține buchetul în poală, se uită unul la altul și râd.","They sit on a bench or on steps, close together. She holds the bouquet in her lap, they look at each other and laugh."]},{"src":"poses/gw16.jpg","by":"Omar Tursić","id":"HnxfKgfM5ww","n":["Siluetă la apus","Silhouette at sunset"],"d":["Stau în fața cerului de apus, cu brațele ei pe după gâtul lui. Atinge cerul pe ecran, ca ei să rămână siluete.","They stand against the sunset sky, her arms around his neck. Tap the sky on your screen so they stay silhouettes."]}],"m_b3":[{"src":"poses/gb01.jpg","by":"Marius Muresan","id":"xEQxdbeCaUI","n":["Pe spate, de sus","On the back, from above"],"d":["Așază copilul pe o pătură albă, lângă fereastră, și fotografiază drept de deasupra. Hăinuțele de botez se văd întregi.","Lay the baby on a white blanket by a window and shoot from straight above. The whole christening outfit shows."]},{"src":"poses/gb02.jpg","by":"Marius Muresan","id":"UIe3RUvxytU","n":["Prim-plan, de aproape","Close-up"],"d":["Apropie-te până când fața și mânuțele umplu cadrul. Așteaptă să se uite spre tine sau spre lumină.","Move in until the face and little hands fill the frame. Wait for the baby to look at you or toward the light."]},{"src":"poses/gb03.jpg","by":"Melisa Figueroa","id":"0Rh9bKqRDA0","n":["Pe burtică, cu obrazul pe mânuțe","On the tummy, cheek on hands"],"d":["Pune-l pe burtică și coboară telefonul la nivelul ochilor lui. Doar câteva secunde, cât se simte bine.","Put the baby on the tummy and lower your phone to eye level. Just a few seconds, while the baby is comfortable."]},{"src":"poses/gb04.jpg","by":"Henley Design Studio","id":"Hy9IXna5x_o","n":["Șezând pe pat","Sitting on the bed"],"d":["Dacă stă singur în șezut, așază-l pe pat, cu perne în spate și cu fereastra în spate sau în lateral. Un părinte stă chiar lângă cadru.","If the baby can sit unaided, place them on the bed with pillows behind and the window behind or to the side. A parent stays just out of frame."]},{"src":"poses/gb05.jpg","by":"Christian Bowen","id":"Qtbh5QM3m1I","n":["În coșuleț","In a basket"],"d":["Un coșuleț cu o păturică moale îl ține pe loc. Fotografiază de sus și nu-l lăsa singur nicio clipă.","A basket with a soft blanket keeps the baby in place. Shoot from above and never leave the baby alone in it."]},{"src":"poses/gb06.jpg","by":"Jonathan Borba","id":"Kj8s2GQn0OA","n":["Adormit, înfășat","Asleep, wrapped up"],"d":["Somnul e cel mai ușor moment. Înfășat într-o păturică albă, cu fața spre fereastră, fotografiat de aproape.","Sleep is the easiest moment. Wrapped in a white blanket, face toward the window, shot from close."]},{"src":"poses/gb07.jpg","by":"Manuel Schinner","id":"ZwjFuJ7ebpk","n":["Tălpile în palmele părinților","Feet in the parents' hands"],"d":["Părintele ține tălpile în căușul palmelor. Focalizează pe degețele și lasă copilul neclar, în fundal.","A parent cups the feet in both hands. Focus on the toes and leave the baby soft in the background."]},{"src":"poses/gb08.jpg","by":"Hu Chen","id":"tCbTGNwrFNM","n":["Mânuța în mâna părintelui","The little hand in a parent's hand"],"d":["Pumnul copilului stă în palma părintelui sau îi strânge un deget. Cadru strâns, doar mâinile.","The baby's fist rests in the parent's palm or grips a finger. A tight frame, hands only."]},{"src":"poses/gb09.jpg","by":"Marius Muresan","id":"h7ZAzCapduk","n":["Nas în nas cu mama","Nose to nose with mom"],"d":["Mama îl ridică la nivelul feței, cu o mână sub cap, și își atinge nasul de al lui. Fotografiază din profil, lângă fereastră.","Mom lifts the baby to face level, one hand under the head, and touches noses. Shoot in profile, by a window."]},{"src":"poses/gb10.jpg","by":"Jonathan Borba","id":"RWgE9_lKj_Y","n":["Ridicat în brațe, frunte în frunte","Lifted up, forehead to forehead"],"d":["Mama îl ține de sub brațe, puțin mai sus decât fața ei, și își lipește fruntea de a lui. Perdeaua albă din spate face lumina moale.","Mom holds the baby under the arms, slightly above her face, forehead to forehead. A white curtain behind makes the light soft."]},{"src":"poses/gb11.jpg","by":"Marius Muresan","id":"i6u5k_v1L8Q","n":["În brațele tatălui","In dad's arms"],"d":["Tatăl îl ține la piept, cu o mână sub cap, și se uită la el. Lumina vine dintr-o parte, de la fereastră.","Dad holds the baby to his chest, one hand under the head, and looks down. The light comes from one side, from a window."]},{"src":"poses/gb12.jpg","by":"Olivia Anne Snyder","id":"Bmb4OVNozOs","n":["Culcat pe antebraț","Lying on the forearm"],"d":["Copilul stă culcat pe antebraț, cu capul sprijinit în palmă. Fotografiază din lateral, cu fereastra în spate.","The baby lies along the forearm, head supported in the palm. Shoot from the side with the window behind."]},{"src":"poses/gb13.jpg","by":"Kateryna Hliznitsova","id":"W6_XEj2idZc","n":["Peste umărul tatălui","Over dad's shoulder"],"d":["Tatăl stă cu spatele la tine, copilul se uită peste umărul lui. Strigă-l pe nume ca să privească spre cameră.","Dad stands with his back to you, the baby looks over his shoulder. Call the baby's name to get a look at the camera."]},{"src":"poses/gb14.jpg","by":"Marius Muresan","id":"0oscP1B8Na4","n":["În brațe, zâmbind","Held and smiling"],"d":["Ținut în brațe, cu fața spre lumină, între două persoane dragi. Fotografiază peste umărul uneia dintre ele.","Held in someone's arms, face toward the light, between two loved ones. Shoot over the shoulder of one of them."]},{"src":"poses/gb15.jpg","by":"Nataliia Hordiiuk","id":"8A6chnMB6Eo","n":["Cu amândoi părinții","With both parents"],"d":["Mama îl sărută pe obraz, tatăl se apleacă spre ei. Afară, cu soarele în spatele lor.","Mom kisses the baby's cheek, dad leans in toward them. Outdoors, with the sun behind them."]}]};
function slides(id,label){

  let fix=()=>{};
  const fig=(p,alt,cap,lazy)=>{const at={src:p.src,alt,width:'797',height:'637',decoding:'async',onerror:e=>{e.target.closest('.sl').remove();fix()}};if(lazy)at.loading='lazy';return h('figure',{class:'sl'},h('div',{class:'pw'},h('img',at),p.by&&h('figcaption',{},h('a',{href:'https://unsplash.com/photos/'+p.id,target:'_blank',rel:'noopener noreferrer'},t('by')+' '+p.by+' · Unsplash'))),cap)};
  if(ph)items.push(fig(ph,label));
  gal.forEach(g=>items.push(fig(g,L(g.n),h('div',{class:'cap'},h('b',{},L(g.n))),items.length>1)));
  if(D[id])items.push(h('div',{class:'sl'},thumb(id,1,label)));
  if(items.length<2)return items[0]||null;

  /* ---- paging (track position) ---- */
  const W=()=>ov.clientWidth,H=()=>ov.clientHeight,GAP=16;

}
